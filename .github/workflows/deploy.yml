name: Deploy to EC2

on:
  workflow_run:
    workflows:
      - "Build and Push Docker Images"
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Validate EC2 secrets
        shell: bash
        run: |
          if [ -z "${{ secrets.EC2_HOST }}" ]; then
            echo "ERROR: EC2_HOST is missing"
            exit 1
          fi

          if [ -z "${{ secrets.EC2_USER }}" ]; then
            echo "ERROR: EC2_USER is missing"
            exit 1
          fi

          if [ -z "${{ secrets.EC2_SSH_KEY }}" ]; then
            echo "ERROR: EC2_SSH_KEY is missing"
            exit 1
          fi

          echo "EC2 deployment secrets are present."

      - name: Configure SSH key
        shell: bash
        run: |
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > "$HOME/.ssh/ec2_key"
          chmod 600 "$HOME/.ssh/ec2_key"

          ssh-keygen -y -f "$HOME/.ssh/ec2_key" > /dev/null
          echo "SSH private key is valid."

      - name: Test EC2 SSH port
        shell: bash
        run: |
          echo "Testing connectivity to EC2 port 22..."
          timeout 10 bash -c 'cat < /dev/null > /dev/tcp/${{ secrets.EC2_HOST }}/22'
          echo "EC2 port 22 is reachable."

      - name: Add EC2 host key
        shell: bash
        run: |
          ssh-keyscan -T 10 -H "${{ secrets.EC2_HOST }}" >> "$HOME/.ssh/known_hosts"

      - name: Copy production Compose file
        shell: bash
        run: |
          ssh -i "$HOME/.ssh/ec2_key" \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            "mkdir -p ~/Dockerized-Student-Registration-System"

          scp -i "$HOME/.ssh/ec2_key" \
            docker-compose.prod.yml \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:~/Dockerized-Student-Registration-System/docker-compose.prod.yml"

      - name: Deploy application
        shell: bash
        run: |
          ssh -i "$HOME/.ssh/ec2_key" \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" <<'REMOTE'
          set -e

          cd ~/Dockerized-Student-Registration-System

          docker compose -f docker-compose.prod.yml pull
          docker compose -f docker-compose.prod.yml up -d --remove-orphans

          sleep 10

          docker compose -f docker-compose.prod.yml ps

          curl -fsS http://localhost/ > /dev/null

          echo "DEPLOYMENT SUCCESSFUL"
          REMOTE
