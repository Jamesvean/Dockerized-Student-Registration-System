name: Deploy to EC2

on:
  workflow_run:
    workflows:
      - "Build and Push Docker Images"
    types:
      - completed

jobs:
  deploy:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Copy production Compose file
        run: |
          scp -i ~/.ssh/ec2_key \
            docker-compose.prod.yml \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:~/Dockerized-Student-Registration-System/docker-compose.prod.yml"

      - name: Deploy application
        run: |
          ssh -i ~/.ssh/ec2_key \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" <<'REMOTE'
              set -e

              cd ~/Dockerized-Student-Registration-System

              echo "Pulling latest images..."
              docker compose -f docker-compose.prod.yml pull

              echo "Starting application..."
              docker compose -f docker-compose.prod.yml up -d --remove-orphans

              echo "Waiting for application..."
              sleep 10

              echo "Container status:"
              docker compose -f docker-compose.prod.yml ps

              echo "Running health check..."
              curl -fsS http://localhost/ > /dev/null

              echo "DEPLOYMENT SUCCESSFUL"
          REMOTE
