      - name: Validate EC2 secrets
        run: |
          test -n "${{ secrets.EC2_HOST }}" || { echo "EC2_HOST is missing"; exit 1; }
          test -n "${{ secrets.EC2_USER }}" || { echo "EC2_USER is missing"; exit 1; }
          test -n "${{ secrets.EC2_SSH_KEY }}" || { echo "EC2_SSH_KEY is missing"; exit 1; }
          echo "EC2 secrets are present"

      - name: Configure SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keygen -y -f ~/.ssh/ec2_key > /dev/null
          echo "SSH private key is valid"

      - name: Test EC2 port 22
        run: |
          timeout 10 bash -c 'cat < /dev/null > /dev/tcp/${{ secrets.EC2_HOST }}/22'
          echo "EC2 port 22 is reachable"

      - name: Add EC2 host key
        run: |
          ssh-keyscan -T 10 -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts
