services:

  db:
    image: jamesaws/student-registration-db:${IMAGE_TAG:-latest}
    container_name: student-db

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}

    volumes:
      - mysql_data:/var/lib/mysql

    networks:
      - dbnet

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

    logging:
      driver: awslogs
      options:
        awslogs-region: eu-west-2
        awslogs-group: /student-registration/db
        awslogs-stream: db

  app:
    image: jamesaws/student-registration-app:${IMAGE_TAG:-latest}
    container_name: student-app

    environment:
      DB_HOST: ${DB_HOST}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      DB_NAME: ${DB_NAME}

    networks:
      - webnet
      - dbnet

    depends_on:
      db:
        condition: service_healthy

    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    logging:
      driver: awslogs
      options:
        awslogs-region: eu-west-2
        awslogs-group: /student-registration/app
        awslogs-stream: app

  web:
    image: jamesaws/student-registration-web:${IMAGE_TAG:-latest}
    container_name: student-web

    ports:
      - "80:80"

    networks:
      - webnet

    depends_on:
      app:
        condition: service_healthy

    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "nginx -t || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    logging:
      driver: awslogs
      options:
        awslogs-region: eu-west-2
        awslogs-group: /student-registration/web
        awslogs-stream: web

volumes:
  mysql_data:

networks:
  webnet:
  dbnet:
