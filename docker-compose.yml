services:

  web:
    image: nginx:latest
    container_name: student-web
    ports:
      - "80:80"
    volumes:
      - ./web/code:/usr/share/nginx/html
      - ./web/config:/etc/nginx/conf.d
    networks:
      - webnet
    depends_on:
      - app

  app:
    image: bitnami/php-fpm:latest
    container_name: student-app
    volumes:
      - ./app/code:/app
    networks:
      - webnet
      - dbnet
    depends_on:
      - db

  db:
    build: ./db
    container_name: student-db
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - dbnet

volumes:
  mysql_data:

networks:
  webnet:
  dbnet:
